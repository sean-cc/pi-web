<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi Web</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="btn-new-chat" id="btnNewChat" title="New chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New chat</span>
      </button>
    </div>
    <div class="sidebar-sessions" id="sessionList">
      <!-- Sessions loaded dynamically -->
    </div>
    <div class="sidebar-footer">
      <button class="btn-model-selector" id="btnModelSelector" title="Select model">
        <div class="sidebar-model" id="sidebarModel">No model configured</div>
        <span class="model-chevron">▾</span>
      </button>
      <div class="sidebar-info">pi Web UI</div>
      <button class="btn-theme-toggle" id="btnThemeToggle" title="Toggle theme">
        <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Model selector modal -->
  <div class="modal-overlay hidden" id="modelModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Select Model</h3>
        <button class="modal-close" id="btnModalClose">✕</button>
      </div>
      <div class="modal-body" id="modelList">
        <div class="modal-loading">Loading models...</div>
      </div>
    </div>
  </div>

  <!-- Session resume modal -->
  <div class="modal-overlay hidden" id="sessionModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Resume Session</h3>
        <button class="modal-close" id="btnSessionModalClose">✕</button>
      </div>
      <div class="modal-body">
        <input id="sessionSearch" class="modal-search" type="search" placeholder="Search sessions..." autocomplete="off">
        <div id="sessionPickerList">
          <div class="modal-loading">Loading sessions...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main chat area -->
  <main class="chat">
    <!-- Messages -->
    <div class="chat-body">
      <div class="chat-messages" id="chatMessages">
        <div class="welcome">
          <div class="welcome-logo">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 12l2.5 2.5L16 9"></path>
            </svg>
          </div>
          <h2>pi Web</h2>
          <p>Web interface for pi coding agent</p>
        </div>
      </div>

      <!-- Conversation timeline: jump between earlier prompts -->
      <div class="chat-ruler" id="chatRuler" hidden>
        <div class="ruler-track" id="rulerTrack" role="navigation" aria-label="Conversation timeline" title="Conversation timeline (↑ / ↓ to navigate)" tabindex="0"></div>
      </div>
      <div class="ruler-tip" id="rulerTip" role="tooltip">
        <div class="ruler-tip-role" id="rulerTipRole"></div>
        <div class="ruler-tip-text" id="rulerTipText"></div>
      </div>

      <button class="btn-scroll-bottom hidden" id="btnScrollBottom" type="button" title="Jump to latest" aria-label="Jump to latest message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="4" x2="12" y2="20"></line>
          <polyline points="18 14 12 20 6 14"></polyline>
        </svg>
      </button>
    </div>

    <!-- Input area -->
    <div class="chat-input-area">
      <div class="chat-input-container" id="chatInputContainer">
        <div class="attachment-tray hidden" id="attachmentTray" aria-live="polite"></div>
        <div class="slash-menu hidden" id="slashMenu" role="listbox" aria-label="Slash commands"></div>
        <div class="chat-input-row">
          <button class="btn-attach" id="btnAttach" title="Attach images or files" aria-label="Attach images or files">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <textarea
            id="promptInput"
            class="chat-input"
            placeholder="Message pi...  Type / for commands"
            title="Type / to see commands. Attach with the paperclip, drag, or paste."
            rows="1"
            autofocus
          ></textarea>
          <div class="chat-input-actions">
            <button class="btn-send" id="btnSend" title="Send message" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
            <button class="btn-abort hidden" id="btnAbort" title="Stop generating">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="drop-overlay" id="dropOverlay"><span>Drop files to attach</span></div>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <p class="chat-disclaimer">pi coding agent · Images, text and files can be attached · Check results carefully</p>
    </div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
